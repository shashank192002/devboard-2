# Goal - I have to Lint, Build, Test the code for Frontend & Backend
# then Push the images to DockerHub 


name: CI

on:
  workflow_dispatch:


jobs:
  frontend:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout code
          uses: actions/checkout@v7

        - name: Run Tests
          run: npm test
          working-directory: frontend        

        - name: Code Quality
          uses: ./.github/workflows/code-quality.yml

        - name: Docker Login
          uses: docker/login-action@v4
          with:
            username: ${{ vars.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}
        - name: Build and Push 
          uses: docker/build-push-action@v7
          with:
            context: ./frontend
            push: true
            tags: ${{ vars.DOCKERHUB_USERNAME }}/devboard-frontend:latest


  backend:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout code
          uses: actions/checkout@v7

        - name: Setup Go
          uses: actions/setup-go@v6
          with:
            go-version: '1.23'  
            cache-dependency-path: backend/go.sum
            go-version-file: backend/go.mod
            check-latest: false


        - name: Run Go Formatter
          run: go fmt
          working-directory: backend

        - name: Run Go vet
          run: go vet 
          working-directory: backend

        - name: Run Tests in Go
          run: go test 
          working-directory: backend

        - name: Docker Login
          uses: docker/login-action@v4
          with:
            username: ${{ vars.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}
        - name: Build and Push 
          uses: docker/build-push-action@v7
          with:
            context: ./backend
            push: true
            tags: ${{ vars.DOCKERHUB_USERNAME }}/devboard-backend:latest



  deploy:
      needs: [frontend, backend]
      uses: ./.github/workflows/cd.yml  
      secrets: inherit      

        


