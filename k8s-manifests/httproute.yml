apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: devboard-route
  namespace: devboard
spec:
  parentRefs:
    - name: devboard-gateway
  rules:
    # /api/ai/* → ai-service. A longer prefix than "/", so it wins for AI calls.
    # URLRewrite strips "/api/ai" so the service sees /summarise, /ask, etc.
    - matches:
        - path:
            type: PathPrefix
            value: /api/ai
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      # CPU inference streams slowly — raise the default (~15s) route timeout so
      # Envoy doesn't cut off the SSE response.
      timeouts:
        request: "300s"
        backendRequest: "300s"
      backendRefs:
        - name: ai-service
          port: 3005
    # everything else → frontend (which proxies /api → backend internally)
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: devboard-frontend-service
          port: 8081
