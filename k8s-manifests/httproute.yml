apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: devboard-route
  namespace: devboard
spec:
  parentRefs:
    - name: devboard-gateway
  rules:
    # everything else → frontend (which proxies /api → backend internally)
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: devboard-frontend-service
          port: 8081
